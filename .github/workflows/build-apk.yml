name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
      - name: Setup Android SDK
        run: |
          SDK=$HOME/android-sdk
          mkdir -p $SDK/cmdline-tools
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cl.zip
          unzip -q cl.zip -d $SDK/tmp
          mv $SDK/tmp/cmdline-tools $SDK/cmdline-tools/latest
          ln -s $SDK/cmdline-tools/latest $SDK/tools
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK --licenses > /dev/null || true
          $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$SDK\"}" > ~/.bubblewrap/config.json
      - name: Create signing key
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias sofaraa -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass sofaraa-pass-123 -keypass sofaraa-pass-123 -dname "CN=Sofaraa, O=Sofaraa, C=IQ"
          keytool -list -v -keystore android.keystore -alias sofaraa -storepass sofaraa-pass-123 | grep "SHA256:" | tee fingerprint.txt
      - name: Generate Android project
        run: bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
      - name: Build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: sofaraa-pass-123
          BUBBLEWRAP_KEY_PASSWORD: sofaraa-pass-123
        run: bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: sofaraa-app
          path: |
            app-release-signed.apk
            app-release-bundle.aab
            android.keystore
            fingerprint.txt
