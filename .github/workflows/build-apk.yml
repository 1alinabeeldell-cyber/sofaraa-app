name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - name: Create signing key
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias sofaraa -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass sofaraa-pass-123 -keypass sofaraa-pass-123 -dname "CN=Sofaraa, O=Sofaraa, C=IQ"
          keytool -list -v -keystore android.keystore -alias sofaraa -storepass sofaraa-pass-123 | grep "SHA256:" | tee fingerprint.txt
      - name: Generate Android project
        run: bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
      - name: Build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: sofaraa-pass-123
          BUBBLEWRAP_KEY_PASSWORD: sofaraa-pass-123
        run: bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: sofaraa-app
          path: |
            app-release-signed.apk
            app-release-bundle.aab
            android.keystore
            fingerprint.txt
